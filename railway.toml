[build]
builder = "nixpacks"
buildCommand = "npm install --legacy-peer-deps && npx prisma generate && npm run build"

# migrate deploy applies prisma/migrations/ (0_init creates all 9 tables on a
# fresh Postgres). The seed is idempotent — it upserts the 8 committee members —
# so it is safe to run on every boot, and it must run at least once or no
# application can be submitted. Seed failure is logged but does not block start.
[deploy]
startCommand = "npx prisma migrate deploy && (npm run db:seed || echo '[deploy] seed failed — continuing') && npm run start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
