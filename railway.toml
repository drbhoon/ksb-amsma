# Railway builds with Nixpacks. The Docker image lives at docker/Dockerfile,
# outside the root, because Railway auto-detects a root Dockerfile and would use
# it in preference to this setting.
[build]
builder = "NIXPACKS"
# --include=dev is required: Railway sets NODE_ENV=production, which makes a
# plain `npm install` skip devDependencies. next build needs typescript,
# tailwindcss, postcss and autoprefixer, the deploy step needs the prisma CLI,
# and the seed needs tsx — all of them devDependencies.
buildCommand = "npm install --include=dev --legacy-peer-deps && npx prisma generate && npm run build"

# migrate deploy applies prisma/migrations/ (0_init creates all 9 tables on a
# fresh Postgres). The seed is idempotent — it upserts the 8 committee members —
# so it is safe on every boot, and must run at least once or no application can
# be submitted. Seed failure is logged but does not block startup.
[deploy]
startCommand = "npx prisma migrate deploy && (npm run db:seed || echo '[deploy] seed failed — continuing') && npm run start"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
